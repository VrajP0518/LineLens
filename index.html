<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LineLens Sports</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="assets/vendor/chart.umd.min.js" defer></script>
    <script src="data/app_metadata.js" defer></script>
    <script src="data/team_metadata.js" defer></script>
    <script src="data/models/model_registry.js" defer></script>
    <script src="data/tracking/model_record.js" defer></script>
    <script src="data/tracking/model_predictions_log.js" defer></script>
    <script src="data/live/live_heartbeat.js" defer></script>
    <script src="data/predictions/mlb_predictions.js" defer></script>
    <script src="data/predictions/wnba_predictions.js" defer></script>
    <script src="data/sprint5/live_reactions.js" defer></script>
    <script src="data/sprint5/live_reaction_history.js" defer></script>
    <script src="data/sprint5/personalized_feed.js" defer></script>
    <script src="data/sprint5/preferences_schema.js" defer></script>
    <script src="data/sprint5/alerts.js" defer></script>
    <script src="data/sprint5/notification_status.js" defer></script>
    <script src="data/sprint5/gamecast_timeline.js" defer></script>
    <script src="data/sprint5/feed_health.js" defer></script>
    <script src="data/sprint5/feed_diagnostics.js" defer></script>
    <script src="data/sprint5/model_sensitivity.js" defer></script>
    <script src="data/sprint5/model_disagreement.js" defer></script>
    <script src="data/sprint5/model_lab_scenarios.js" defer></script>
    <script src="data/sprint5/simulation_results.js" defer></script>
    <script src="data/sprint5/widget_personalized_state.js" defer></script>
    <script src="src/ui/data_contracts.js" defer></script>
</head>
<body>
    <div id="app-loading" class="app-loading is-visible" role="status" aria-live="polite">
        <div class="app-loading__backdrop" aria-hidden="true"></div>
        <div class="app-loading__content">
            <div class="app-loading__mark" aria-hidden="true">
                <span>LL</span>
                <i></i>
                <b></b>
            </div>
            <p class="app-loading__eyebrow">LineLens Sports</p>
            <h1>LineLens</h1>
            <p id="app-loading-message">Fetching today’s games and predictions…</p>
            <div class="app-loading__progress" aria-hidden="true"><span></span></div>
        </div>
    </div>
    <div id="view-transition-wash" class="view-transition-wash" aria-hidden="true"></div>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand__mark"><img src="images/Logo1.png" alt="LineLens logo" /></span>
                <div>
                    <strong>LineLens Sports</strong>
                    <small id="sidebar-version">v6</small>
                </div>
            </div>
            <nav class="nav" aria-label="Primary navigation">
                <section class="nav__section nav__section--home" aria-label="Home" data-nav-group="home">
                    <button class="nav__section-label nav__section-toggle" type="button" data-nav-toggle="home" aria-expanded="true"><span>Home</span><span aria-hidden="true">⌄</span></button>
                    <button class="nav__item nav__item--home is-active" data-view="home"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-home.png" alt="" /></span><span>Home</span></button>
                </section>
                <section class="nav__section" aria-label="Explore" data-nav-group="explore">
                    <button class="nav__section-label nav__section-toggle" type="button" data-nav-toggle="explore" aria-expanded="true"><span>Explore</span><span aria-hidden="true">⌄</span></button>
                    <button class="nav__item nav__item--picks" data-view="picks"><span class="nav-sport-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 5h14M5 12h10M5 19h6" /></svg></span><span>Picks</span></button>
                    <button class="nav__item nav__item--props" data-view="props"><span class="nav-sport-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 18V6M5 18h14M9 14l3-3 2 2 5-6" /></svg></span><span>Props</span></button>
                <section class="nav__section nav__section--sports" aria-label="Sports" data-nav-group="sports">
                    <button class="nav__section-label nav__section-toggle" type="button" data-nav-toggle="sports" aria-expanded="false"><span>Sports</span><span aria-hidden="true">⌄</span></button>
                    <button class="nav__item nav__item--mlb" data-view="mlb" title="MLB predictions, odds, scores, and box scores"><span class="nav-sport-mark nav-sport-mark--mlb" aria-hidden="true"><img src="assets/sport-icon-mlb.png" alt="" /></span><span class="nav-mlb-word">MLB</span></button>
                    <button class="nav__item nav__item--nfl" data-view="nfl" title="NFL predictions, spreads, and scores"><span class="nav-sport-mark nav-sport-mark--nfl" aria-hidden="true"><img src="assets/sport-icon-nfl.png" alt="" /></span><span>NFL</span></button>
                    <button class="nav__item nav__item--wnba" data-view="wnba" title="WNBA predictions, props, and scores"><span class="nav-sport-mark nav-sport-mark--wnba" aria-hidden="true"><img src="assets/sport-icon-wnba.png" alt="" /></span><span>WNBA</span></button>
                    <button class="nav__item nav__item--nba" data-view="nba" title="Scores only — no LineLens prediction model"><span class="nav-sport-mark nav-sport-mark--nba" aria-hidden="true"><img src="assets/sport-icon-nba.png" alt="" /></span><span>NBA <small class="nav-item-note">Scores only</small></span></button>
                    <button class="nav__item nav__item--nhl" data-view="nhl" title="Scores only — no LineLens prediction model"><span class="nav-sport-mark nav-sport-mark--nhl" aria-hidden="true"><img src="assets/sport-icon-nhl.png" alt="" /></span><span>NHL <small class="nav-item-note">Scores only</small></span></button>
                    <button class="nav__item nav__item--soccer" data-view="soccer" title="Scores only — no LineLens prediction model"><span class="nav-sport-mark nav-sport-mark--soccer" aria-hidden="true"><img src="assets/sport-icon-soccer.png" alt="" /></span><span>Soccer <small class="nav-item-note">Scores only</small></span></button>
                </section>
                </section>
                <section class="nav__section" aria-label="My LineLens" data-nav-group="mine">
                    <button class="nav__section-label nav__section-toggle" type="button" data-nav-toggle="mine" aria-expanded="false"><span>My LineLens</span><span aria-hidden="true">⌄</span></button>
                    <button class="nav__item nav__item--watchlist" data-view="watchlist"><span class="nav-sport-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m12 4 2.45 4.96 5.48.8-.94 5.45L12 16.5l-4.91 2.57.94-5.45-.94-5.45 5.48-.8Z" /></svg></span><span>Watchlist</span></button>
                    <button class="nav__item nav__item--tracking" data-view="tracking"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-tracking.png" alt="" /></span><span>My Tracker</span></button>
                </section>
                <section class="nav__section" aria-label="Analytics" data-nav-group="analytics">
                    <button class="nav__section-label nav__section-toggle" type="button" data-nav-toggle="analytics" aria-expanded="false"><span>Analytics</span><span aria-hidden="true">⌄</span></button>
                    <button class="nav__item nav__item--models" data-view="models"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-models.png" alt="" /></span><span>Models</span></button>
                    <button class="nav__item nav__item--reports" data-view="reports"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-reports.png" alt="" /></span><span>Reports</span></button>
                    <button class="nav__item nav__item--record" data-view="record"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-record.png" alt="" /></span><span>Performance</span></button>
                </section>
                <section class="nav__section" aria-label="More" data-nav-group="more">
                    <button class="nav__section-label nav__section-toggle" type="button" data-nav-toggle="more" aria-expanded="false"><span>More</span><span aria-hidden="true">⌄</span></button>
                    <button class="nav__item nav__item--foryou" data-view="foryou"><span class="nav-sport-mark" aria-hidden="true">✦</span><span>For You</span></button>
                    <button class="nav__item nav__item--history" data-view="history"><span class="nav-sport-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 12a8 8 0 1 0 2.35-5.65L4 8.7M4 4v4.7h4.7" /></svg></span><span>Prediction History</span></button>
                    <button class="nav__item nav__item--teams" data-view="teams"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-teams.png" alt="" /></span><span>Teams</span></button>
                    <button class="nav__item nav__item--settings" data-view="settings"><span class="nav-sport-mark" aria-hidden="true"><img src="assets/nav-icon-settings.png" alt="" /></span><span>Settings</span></button>
                </section>
            </nav>
            <div class="sidebar__product">
                <section class="nav__section nav__section--utility" aria-label="Product information">
                    <p class="nav__section-label">Product</p>
                    <button class="nav__item nav__item--about" data-view="about"><span class="nav-sport-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8.5" /><path d="M12 10.5v5M12 7.5h.01" /></svg></span><span>About</span></button>
                </section>
            </div>
            <div class="sidebar__note">
                <span class="status-dot"></span>
                Updates show whether data is live, cached, or unavailable.
            </div>
            <button class="ll-sidebar-engine" type="button" data-view-link="settings" aria-label="Open data health settings">
                <strong>Data health</strong>
                <span>Live, cached, or unavailable</span>
                <i aria-hidden="true"></i>
            </button>
            <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <div>
                    <div class="topbar__eyebrow-row">
                        <p class="eyebrow" id="view-kicker">Today’s board</p>
                        <button id="global-health-signal" class="global-health-signal" type="button" data-view-link="settings" data-tone="loading" aria-label="Open data health in Settings">
                            <span aria-hidden="true"></span>
                            <strong>Loading data</strong>
                        </button>
                    </div>
                    <h1 id="view-title">LineLens Sports</h1>
                </div>
                <div class="topbar__meta">
                    <button id="command-palette-btn" class="btn command-palette-trigger topbar-action" type="button" aria-label="Search and quick switch" aria-haspopup="dialog" aria-controls="command-palette-root">
                        <svg class="topbar-action__icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
                        <span class="topbar-action__label">Search</span>
                        <kbd>Ctrl K</kbd>
                    </button>
                    <button id="refresh-btn" class="btn btn--primary topbar-action" type="button" aria-label="Refresh data">
                        <svg class="topbar-action__icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5"></path><path d="M18.2 15.5a7 7 0 1 1-.4-7.5L20 10"></path></svg>
                        <span class="topbar-action__label">Refresh</span>
                    </button>
                    <button id="notifications-btn" class="btn topbar-action topbar-action--icon" type="button" aria-label="Open notifications" data-view-link="notifications">
                        <span class="notification-bell" aria-hidden="true">♢</span>
                        <span class="sprint5-nav-badge topbar-notification-badge" aria-label="Unread notifications">0</span>
                    </button>
                    <button id="about-btn" class="btn topbar-action" type="button" aria-label="About LineLens" data-view-link="about">
                        <svg class="topbar-action__icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7h.01"></path></svg>
                        <span class="topbar-action__label">About</span>
                    </button>
                </div>
            </header>

            <p class="data-status" id="data-status">Getting today’s games and predictions…</p>

            <main>
                <section class="view is-active" id="view-home"></section>
                <section class="view" id="view-foryou"></section>
                <section class="view" id="view-picks"></section>
                <section class="view" id="view-underdogs"></section>
                <section class="view" id="view-props"></section>
                <section class="view" id="view-nfl"></section>
                <section class="view" id="view-mlb"></section>
                <section class="view" id="view-mlb-economics"></section>
                <section class="view" id="view-soccer"></section>
                <section class="view" id="view-nba"></section>
                <section class="view" id="view-nhl"></section>
                <section class="view" id="view-wnba"></section>
                <section class="view" id="view-models"></section>
                <section class="view" id="view-history"></section>
                <section class="view" id="view-watchlist"></section>
                <section class="view" id="view-reports"></section>
                <section class="view" id="view-record"></section>
                <section class="view" id="view-teams"></section>
                <section class="view" id="view-tracking"></section>
                <section class="view" id="view-settings"></section>
                <section class="view" id="view-notifications"></section>
                <section class="view" id="view-about"></section>
            </main>
            <footer class="global-footer"><span>LineLens Sports · <span id="footer-version">v6</span></span><button class="link-btn" type="button" data-view-link="about">Created by Vraj Patel</button></footer>
        </div>
    </div>

    <div id="global-ticker" class="global-ticker-slot" aria-live="polite"></div>
    <div id="gamecast-root"></div>
    <div id="live-notification-root" class="live-notification-root" aria-live="polite"></div>
    <div id="onboarding-root"></div>
    <div id="about-root"></div>
    <div id="command-palette-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="sprint5.js" defer></script>
    <script src="src/ui/view_policies.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
