name: Retrain Models

on:
  workflow_dispatch:
    inputs:
      sport:
        description: Model family to retrain
        required: true
        default: all
        type: choice
        options:
          - all
          - mlb
          - nfl
          - wnba
  schedule:
    - cron: "15 9 * * 0"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: linelens-model-retraining
  cancel-in-progress: false

jobs:
  retrain:
    name: Chronological retraining and review
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHARP_ODDS_API_KEY: ${{ secrets.SHARP_ODDS_API_KEY }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Confirm Actions may create review pull requests
        id: pr_permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # This repository-level endpoint requires admin scope that the
          # default GITHUB_TOKEN intentionally does not have. Treat a 403 (or
          # an older GitHub Enterprise response) as unknown instead of failing
          # the retraining job. The PR action below is still attempted when
          # unknown and has its own non-blocking manual-review fallback.
          set +e
          allowed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews' 2>/dev/null)"
          api_status=$?
          set -e
          if [[ "$api_status" -ne 0 || -z "$allowed" ]]; then
            allowed="unknown"
            echo "::notice::Repository PR permission could not be queried with GITHUB_TOKEN; the PR action will be attempted and may fall back to the signed artifact."
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [[ "$allowed" == "false" ]]; then
            echo "::warning::GitHub Actions cannot create pull requests for this repository. Retraining will continue and publish a signed review artifact with a patch. To restore automatic PRs, enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci

      - name: Preserve approved baseline
        run: cp data/models/model_registry.json "$RUNNER_TEMP/model_registry_before.json"

      - name: Retrain selected model family
        env:
          REQUESTED_SPORT: ${{ github.event.inputs.sport || 'all' }}
        run: |
          if [[ "$REQUESTED_SPORT" == "all" || "$REQUESTED_SPORT" == "mlb" ]]; then
            python scripts/refresh_data.py --sport mlb --mode all
          fi
          if [[ "$REQUESTED_SPORT" == "all" || "$REQUESTED_SPORT" == "wnba" ]]; then
            python scripts/refresh_data.py --sport wnba --mode all
          fi
          if [[ "$REQUESTED_SPORT" == "all" || "$REQUESTED_SPORT" == "nfl" ]]; then
            python scripts/refresh_data.py --sport nfl --mode real
          fi
          python scripts/score_model_predictions.py

      - name: Refresh market evidence with repository secrets
        run: |
          python scripts/live_scores.py --days-back 1 --days-forward 7 --output-stem live_heartbeat
          python scripts/odds_snapshots.py
          python scripts/refresh_props.py
          python scripts/refresh_pending_results.py --strict
          python scripts/score_model_predictions.py

      - name: Generate drift alerts
        run: |
          python scripts/model_drift_report.py --baseline "$RUNNER_TEMP/model_registry_before.json"
          cat data/reports/model_drift_alerts.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated artifacts
        run: |
          npm run check:js
          python -m compileall src scripts
          npm run check:data
          npm run check:props
          npm run check:logos
          npm run check:v6

      - name: Build reviewable model bundle
        run: python scripts/build_model_bundle.py --output-dir dist-models --model-version "v6-pr-${{ github.run_number }}"

      - name: Build manual review fallback
        shell: bash
        run: |
          git diff --binary -- models data/models data/reports data/predictions data/tracking/model_record.json > dist-models/retraining-review.patch
          {
            echo "LineLens v6 retraining review fallback"
            echo "Run: ${GITHUB_RUN_ID} / attempt ${GITHUB_RUN_ATTEMPT}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Apply only after reviewing model comparison, holdout log loss, Brier score, calibration, and drift alerts."
            echo "Patch: retraining-review.patch"
          } > dist-models/manual-review.txt

      - name: Sign retraining provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist-models/linelens-models-v6.zip
            dist-models/model-manifest.json

      - name: Upload retraining audit artifact
        uses: actions/upload-artifact@v6
        with:
          name: linelens-v6-retraining-${{ github.run_number }}
          path: |
            models/*.joblib
            data/models/*
            data/reports/*
            data/predictions/*
            data/tracking/model_record.*
            data/reports/model_drift_alerts.*
            dist-models/*
          if-no-files-found: error
          retention-days: 30

      - name: Open review pull request when artifacts improve or change
        id: create_review_pr
        if: steps.pr_permission.outputs.allowed != 'false'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/model-retraining-v6
          delete-branch: true
          commit-message: "chore(models): refresh trained artifacts"
          title: "chore(models): review automated v6 retraining"
          body: |
            Automated chronological LineLens retraining.

            Review the model comparison, holdout log loss, Brier score, calibration, and generated model cards before merging. This workflow does not publish a candidate directly to users.

            Drift alerts are included in `data/reports/model_drift_alerts.md`.
            Signed build provenance: ${{ steps.attest.outputs.attestation-url }}
          labels: |
            models
            automated
          add-paths: |
            models/*.joblib
            data/models/*
            data/reports/*
            data/predictions/*
            data/tracking/model_record.*
            data/reports/model_drift_alerts.*

      - name: Report manual review fallback
        if: always() && (steps.pr_permission.outputs.allowed != 'true' || steps.create_review_pr.outcome == 'failure')
        shell: bash
        run: |
          echo "::warning::Automatic review PR was unavailable. The signed linelens-v6-retraining-${GITHUB_RUN_NUMBER} artifact contains the complete model bundle, drift report, and retraining-review.patch."
          {
            echo "### Manual model review required"
            echo ""
            echo "Retraining and validation completed, but GitHub did not create the review PR."
            echo "Download the signed \`linelens-v6-retraining-${GITHUB_RUN_NUMBER}\` artifact from this run."
            echo "Review \`data/reports/model_drift_alerts.md\`, the holdout metrics, and \`dist-models/retraining-review.patch\` before applying anything."
            echo "No model was promoted or published automatically."
          } >> "$GITHUB_STEP_SUMMARY"
