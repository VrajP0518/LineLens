name: Tauri Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build LineLens Sports for Windows
    runs-on: windows-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHARP_ODDS_API_KEY: ${{ secrets.SHARP_ODDS_API_KEY }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      # These names are consumed only at Rust compile time. The resulting app
      # uses them as defaults while still allowing a user's local .env values
      # to override them.
      LINELENS_DEFAULT_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      LINELENS_DEFAULT_SHARP_ODDS_API_KEY: ${{ secrets.SHARP_ODDS_API_KEY }}
      LINELENS_DEFAULT_PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Confirm provider secrets for data and packaged defaults
        shell: pwsh
        run: |
          $missing = @('ODDS_API_KEY', 'SHARP_ODDS_API_KEY', 'PROPLINE_API_KEY') | Where-Object { -not (Get-Item "Env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing) { throw "Missing repository secrets: $($missing -join ', ')" }

      - name: Refresh sanitized data before packaging
        run: |
          python scripts/refresh_data.py --sport mlb --mode predict
          python scripts/refresh_data.py --sport wnba --mode predict
          python scripts/live_scores.py --days-back 1 --days-forward 7 --output-stem live_heartbeat
          python scripts/odds_snapshots.py
          python scripts/refresh_props.py
          python scripts/refresh_pending_results.py --strict
          python scripts/score_model_predictions.py
          python scripts/score_prop_predictions.py

      - name: Prove provider keys are not packaged
        run: python scripts/build_shared_data_bundle.py --output-dir dist-shared-data-check --data-version "v6-build-${{ github.run_number }}"

      - name: Verify release bundle and data contracts
        run: npm run verify:release

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Verify packaged Tauri runtime resources
        run: npm run check:tauri:resources

      - name: Capture packaged runtime verification
        shell: pwsh
        run: |
          python scripts/verify_tauri_resources.py | Tee-Object tauri-resource-verification.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw 'No Windows installers were generated.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8 release-checksums.txt

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: LineLens-Sports-Windows-v6.0.0
          path: |
            src-tauri/target/release/bundle/**
            tauri-resource-verification.txt
            release-checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LineLens Sports ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-checksums.txt
