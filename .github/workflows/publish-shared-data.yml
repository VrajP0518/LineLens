name: Publish Shared Data Channel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 10 * * 2"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: linelens-shared-data-v6
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHARP_ODDS_API_KEY: ${{ secrets.SHARP_ODDS_API_KEY }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Confirm required secret configuration
        shell: bash
        run: |
          missing=0
          for name in ODDS_API_KEY SHARP_ODDS_API_KEY PROPLINE_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"
      - name: Download previous shared-data state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/linelens-data-channel"
          gh release download data-channel-v6 --dir "$RUNNER_TEMP/linelens-data-channel" --pattern 'linelens-shared-data-v6.zip' --pattern 'shared-data-manifest.json' || true
          python scripts/restore_shared_data_bundle.py --manifest "$RUNNER_TEMP/linelens-data-channel/shared-data-manifest.json" --bundle "$RUNNER_TEMP/linelens-data-channel/linelens-shared-data-v6.zip"
      - name: Refresh official NFL historical data
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 10 * * 2'
        run: python scripts/refresh_data.py --sport nfl --mode real
      - name: Refresh sanitized shared exports
        run: |
          python scripts/refresh_data.py --sport mlb --mode predict
          python scripts/refresh_data.py --sport wnba --mode predict
          python scripts/live_scores.py --days-back 1 --days-forward 7 --output-stem live_heartbeat
          python scripts/odds_snapshots.py
          python scripts/refresh_props.py
          python scripts/refresh_pending_results.py --strict
          python scripts/score_model_predictions.py
          python scripts/score_prop_predictions.py
      - name: Validate and package public data
        run: |
          python scripts/check_data_integrity.py
          python scripts/check_props.py
          python scripts/build_shared_data_bundle.py --data-version "v6-${{ github.run_number }}"
      - name: Sign shared-data provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist-shared-data/linelens-shared-data-v6.zip
            dist-shared-data/shared-data-manifest.json
      - name: Publish stable data channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-channel-v6
          name: LineLens v6 shared data channel
          prerelease: true
          make_latest: false
          files: |
            dist-shared-data/linelens-shared-data-v6.zip
            dist-shared-data/shared-data-manifest.json
